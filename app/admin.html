<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Plusflix - Panel Admina</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
      .admin-nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; }
      .admin-nav button { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; transition: 0.3s; }
      .admin-nav button.active { color: #3b82f6; font-weight: bold; border-bottom: 2px solid #3b82f6; }
      .admin-card { background: #151821; padding: 20px; border-radius: 10px; border: 1px solid #222; margin-bottom: 20px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .full-width { grid-column: span 2; }
      input, textarea { background: #1e2230; border: 1px solid #333; color: white; padding: 10px; border-radius: 5px; width: 100%; margin-top: 5px; }
      .btn-save { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
      .btn-save:hover { background: #2563eb; }
      .hidden { display: none !important; }
      h2 { margin-bottom: 20px; font-size: 1.5rem; }
    </style>
  </head>
  <body>
    <div class="admin-container">

      <div id="loginSection" class="admin-card">
        <h2>Logowanie do Panelu</h2>
        <form id="loginForm">
          <input type="text" id="username" placeholder="Login" required />
          <input type="password" id="password" placeholder="Hasło" required />
          <button type="submit" class="btn-save">Zaloguj się</button>
        </form>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="admin-nav">
          <button id="btnTabMovies" class="active">Zarządzanie Filmami</button>
          <button id="btnTabProfile">Ustawienia Profilu</button>
          <button id="logoutBtn" style="margin-left: auto; color: #ef4444;">Wyloguj</button>
        </div>

        <div id="sectionMovies">
          <form id="movieForm" class="admin-card">
            <h2>Dodaj / Edytuj film</h2>
            <input type="hidden" id="movieId">
            <div class="form-grid">
              <input id="title" placeholder="Tytuł" required />
              <input id="year" type="number" placeholder="Rok" />
              <input id="rating" type="number" step="0.1" placeholder="Ocena" />
              <input id="platform" placeholder="Platforma" />
              <input id="type" placeholder="Typ (Film / Serial)" />
              <input id="duration" placeholder="Czas trwania" />
              <input id="poster" class="full-width" placeholder="URL Plakatu" />
              <textarea id="description" class="full-width" placeholder="Opis" rows="4"></textarea>
            </div>
            <button type="submit" class="btn-save">Zapisz zmiany</button>
          <div id="moviesList"></div>
          </form>
        </div>

        <div id="sectionProfile" class="hidden">
          <form id="profileForm" class="admin-card">
            <h2>Zmień dane administratora</h2>
            <div class="form-grid">
              <input type="text" id="newUsername" placeholder="Nowy Login" />
              <input type="password" id="newPassword" placeholder="Nowe Hasło" />
            </div>
            <button type="submit" class="btn-save">Aktualizuj profil</button>
          </form>
        </div>
      </div>

    </div>
    <script src="js/admin.js"></script>
  </body>
</html>
