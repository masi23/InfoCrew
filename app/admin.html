<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Panel administratora</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
      }
      form {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ccc;
      }
      input,
      textarea,
      select,
      button {
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Panel administratora</h1>

    <!-- LOGIN -->
    <form id="loginForm">
      <h2>Logowanie</h2>
      <input type="text" id="username" placeholder="Login" required />
      <input type="password" id="password" placeholder="Hasło" required />
      <button>Zaloguj</button>
    </form>

    <!-- PANEL CRUD -->
    <div id="adminPanel" class="hidden">
      <button id="logoutBtn">Wyloguj</button>

      <form id="movieForm">
        <h2>Dodaj / edytuj film</h2>

        <input id="title" placeholder="Tytuł" required />
        <textarea id="description" placeholder="Opis"></textarea>
        <input id="year" type="number" placeholder="Rok" />
        <input id="rating" type="number" step="0.1" placeholder="Ocena" />
        <input id="platform" placeholder="Platforma" />
        <input id="type" placeholder="Typ (Film / Serial)" />
        <button>Zapisz</button>
      </form>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
